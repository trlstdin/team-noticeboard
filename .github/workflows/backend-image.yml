name: Build portable backend
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
concurrency:
  group: noticeboard-backend-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/trlstdin/team-noticeboard:latest
            ghcr.io/trlstdin/team-noticeboard:${{ github.sha }}
  deploy:
    needs: image
    if: ${{ vars.PRODUCTION_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, noticeboard-production]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Update the registered production host
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu
          test -s /opt/noticeboard/.env
          test -s /opt/noticeboard/compose.yml
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose --project-directory /opt/noticeboard -f /opt/noticeboard/compose.yml pull
          docker compose --project-directory /opt/noticeboard -f /opt/noticeboard/compose.yml up -d --wait
