name: Deploy public noticeboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - scripts/build.mjs
      - worker/**
      - DESIGN.md
      - .github/workflows/pages.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: noticeboard-public-v2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deploy
