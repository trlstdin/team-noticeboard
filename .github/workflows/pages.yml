name: Deploy public noticeboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - package.json
      - package-lock.json
      - scripts/push-backend.mjs
      - scripts/backend-release.mjs
      - scripts/build.mjs
      - scripts/publish-generated-ui.mjs
      - worker/**
      - DESIGN.md
      - .github/workflows/pages.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: noticeboard-public-v2
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: node scripts/build.mjs
      - name: Publish generated UI to repository
        id: publish
        run: node scripts/publish-generated-ui.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Push backend release to Sites
        if: steps.publish.outputs.published == 'true'
        run: node scripts/push-backend.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: deploy
